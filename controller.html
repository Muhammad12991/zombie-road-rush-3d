<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZR Controller - Road Rush 3D</title>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Montserrat:wght@600;800&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            background: radial-gradient(circle, rgba(20, 5, 5, 0.95) 0%, rgba(5, 2, 2, 0.98) 100%);
            font-family: 'Montserrat', sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
            touch-action: none;
            -webkit-touch-callout: none;
        }
        /* Portrait Warning Overlay */
        
        #rotateWarning {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(5, 2, 2, 0.98);
            z-index: 9999;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #ff3333;
            text-align: center;
            padding: 20px;
        }
        
        #rotateWarning h2 {
            font-family: 'Creepster', cursive;
            font-size: 2.5rem;
            letter-spacing: 2px;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(255, 0, 0, 0.8);
        }
        
        #rotateWarning p {
            color: #ccc;
            font-size: 1.1rem;
            letter-spacing: 1px;
        }
        
        @media screen and (orientation: portrait) {
            #rotateWarning {
                display: flex;
            }
        }
        /* Status Bar */
        
        .status-bar {
            padding: 8px 20px;
            background: rgba(10, 10, 15, 0.9);
            color: #ff4444;
            letter-spacing: 2px;
            font-size: 0.85rem;
            font-weight: 800;
            border-bottom: 2px solid rgba(255, 34, 0, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .btn-pause {
            width: 45px;
            height: 32px;
            background: rgba(30, 30, 35, 0.9);
            border: 2px solid rgba(255, 34, 0, 0.5);
            border-radius: 6px;
            color: #fff;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.1s;
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.2);
        }
        
        .btn-pause:active {
            background: #ff2200;
            border-color: #fff;
            transform: scale(0.90);
        }
        /* Main Controls Layout */
        
        .controls {
            display: flex;
            flex: 1;
            padding: 15px 30px;
            justify-content: space-between;
            align-items: center;
        }
        /* Left Zone: Realistic Car Pedal for Spacebar (Drift) */
        
        .left-zone {
            display: flex;
            height: 100%;
            align-items: center;
        }
        
        .pedal-housing {
            width: 110px;
            height: 85%;
            background: rgba(15, 15, 20, 0.6);
            border: 2px solid rgba(255, 34, 0, 0.3);
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 12px 0;
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.8);
        }
        
        .pedal-label {
            color: #ff7777;
            font-size: 0.8rem;
            font-weight: 800;
            letter-spacing: 1.5px;
            margin-bottom: 10px;
        }
        
        .btn-drift {
            width: 85px;
            flex: 1;
            background: linear-gradient(145deg, #2a2a30, #151518);
            border: 3px solid #ff2200;
            border-radius: 10px;
            color: #ff3333;
            font-size: 1rem;
            font-weight: 800;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            transition: transform 0.08s ease, background 0.08s ease, box-shadow 0.08s ease;
            box-shadow: 0 8px 0 #800f00, 0 10px 15px rgba(0, 0, 0, 0.8);
            transform-origin: top center;
        }
        
        .btn-drift:active,
        .btn-drift.active {
            background: linear-gradient(145deg, #ff2200, #b91c1c);
            color: #ffffff;
            transform: translateY(6px) scaleX(0.97);
            box-shadow: 0 2px 0 #500800, 0 4px 10px rgba(255, 34, 0, 0.6);
        }
        
        .pedal-grip {
            width: 50px;
            height: 6px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 3px;
            margin: 4px 0;
        }
        
        .pedal-label-space {
            margin-top: 8px;
            font-size: 0.85rem;
        }
        /* Right Zone: Steering (Left / Right Thumb Buttons) */
        
        .right-zone {
            display: flex;
            gap: 25px;
            align-items: center;
        }
        
        .btn-steer {
            width: 115px;
            height: 115px;
            background: rgba(15, 23, 42, 0.85);
            border: 3px solid #00ffaa;
            border-radius: 22px;
            color: #00ffaa;
            font-size: 3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.08s;
            box-shadow: 0 0 20px rgba(0, 255, 170, 0.2);
        }
        
        .btn-steer:active,
        .btn-steer.active {
            background: #00ffaa;
            border-color: #ffffff;
            color: #000000;
            transform: scale(0.92);
            box-shadow: 0 0 35px rgba(0, 255, 170, 0.7);
        }
    </style>
</head>

<body>
    <!-- Rotate Warning Overlay -->
    <div id="rotateWarning">
        <h2>ROTATE YOUR DEVICE</h2>
        <p>Please rotate your phone to landscape mode for the ultimate driving experience.</p>
    </div>

    <div class="status-bar">
        <span id="status">DISCONNECTED</span>
        <div class="btn-pause" data-btn="pause">❚❚</div>
    </div>

    <div class="controls">
        <!-- Left Side: Realistic Pedal for Spacebar (Drift) -->
        <div class="left-zone">
            <div class="pedal-housing">
                <span class="pedal-label">DRIFT</span>
                <div class="btn-drift" data-btn="drift">
                    <div class="pedal-grip"></div>
                    <div class="pedal-grip"></div>
                    <div class="pedal-grip"></div>
                    <span class="pedal-label-space">SPACE</span>
                </div>
            </div>
        </div>

        <!-- Right Side: Steering Buttons -->
        <div class="right-zone">
            <div class="btn-steer" data-btn="left">◀</div>
            <div class="btn-steer" data-btn="right">▶</div>
        </div>
    </div>

    <script>
        // URL se room ID nikalna
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('room');

        const socket = io('https://zombie-road-rush-3d.onrender.com');
        const statusEl = document.getElementById('status');

        // Server ko room ID bhejna
        socket.emit('registerMobile', roomId);

        socket.on('connectedToPC', () => {
            statusEl.innerText = "CONNECTED";
            statusEl.style.color = "#00ffaa";
        });
        socket.on('disconnect', () => {
            statusEl.innerText = "DISCONNECTED";
            statusEl.style.color = "#ff4444";
        });

        const buttons = document.querySelectorAll('[data-btn]');
        buttons.forEach(btn => {
            btn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                btn.classList.add('active');
                socket.emit('mobileInput', {
                    room: roomId,
                    btn: btn.dataset.btn,
                    state: true
                });
            });
            ['touchend', 'touchcancel'].forEach(evt => btn.addEventListener(evt, (e) => {
                e.preventDefault();
                btn.classList.remove('active');
                socket.emit('mobileInput', {
                    room: roomId,
                    btn: btn.dataset.btn,
                    state: false
                });
            }));
        });
    </script>
</body>

</html>
